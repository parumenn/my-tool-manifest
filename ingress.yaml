apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-tool-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: mytool.parumenn.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-tool-svc
            port:
              number: 80
