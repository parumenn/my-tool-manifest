apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-tool-ingress
  namespace: default
  annotations:
    nginx.org/websocket-services: "my-tool-collab-svc"
spec:
  ingressClassName: nginx-f5
  rules:
  - host: mytool.parumenn.com
    http:
      paths:
      - path: /collab-api
        pathType: Prefix
        backend:
          service:
            name: my-tool-collab-svc
            port:
              number: 8080
      - path: /collab-ws
        pathType: Prefix
        backend:
          service:
            name: my-tool-collab-svc
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-tool-svc
            port:
              number: 80
