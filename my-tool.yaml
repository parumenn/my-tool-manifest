apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-tool-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-tool
  template:
    metadata:
      labels:
        app: my-tool
    spec:
      containers:
        - name: my-tool-web
          image: ghcr.io/parumenn/my-tool-build:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-tool-svc
  namespace: default
spec:
  selector:
    app: my-tool
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      
