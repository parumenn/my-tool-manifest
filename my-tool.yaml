# --- 既存のDeploymentを修正 ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-tool-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-tool
  template:
    metadata:
      labels:
        app: my-tool
    spec:
      containers:
        - name: my-tool-web
          image: ghcr.io/parumenn/my-tool-build:cd154ad7cf13ee072b86db5508a42a6b3d3cce85
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            # PHPが実際にテキストデータを保存するディレクトリを指定（要変更）
            - name: app-data
              mountPath: /var/www/html/backend/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: my-tool-data-pvc
