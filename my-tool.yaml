# --- 追記: データの保存用PVC ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-tool-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# --- 既存のDeploymentを修正 ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-tool-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-tool
  template:
    metadata:
      labels:
        app: my-tool
    spec:
      containers:
        - name: my-tool-web
          image: ghcr.io/parumenn/my-tool-build:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            # PHPが実際にテキストデータを保存するディレクトリを指定（要変更）
            - name: app-data
              mountPath: /var/www/html/backend/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: my-tool-data-pvc
